apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: podmanagers.example.com
spec:
  group: example.com
  names:
    kind: PodManager
    plural: podmanagers
    singular: podmanager
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                replicas:
                  type: integer
                  description: "Number of replicas to scale"
                restartPolicy:
                  type: string
                  enum:
                    - Always
                    - OnFailure
                    - Never
                  description: "Pod restart policy"